schema: splitfleet.physical-latest-rerun-protocol.v1
created_at: "2026-08-12T22:10:00+08:00"
status: profile_pending
classification: independent_post_hoc_systems_replication

topology:
  server: {id: fy205, address: 192.168.66.205, role: persistent_suffix_and_aggregation}
  clients:
    - {id: win136, address: 192.168.66.136, expected_device: cpu}
    - {id: orin140, address: 192.168.66.140, expected_device: cuda}
    - {id: orin118, address: 192.168.66.118, expected_device: cuda}
    - {id: orin238, address: 192.168.66.238, expected_device: cuda}

workload:
  model: wide_resnet50_2
  dataset: cifar10
  normalization: groupnorm
  partition: {type: dirichlet, alpha: 0.5, seed: 1}
  max_train_samples: 8000
  test_samples: 10000
  rounds: 100
  batch_size: 16
  max_batches_per_round: 4
  optimizer: {name: sgd, lr: 0.02, momentum: 0.0, weight_decay: 0.0}
  candidate_cuts: [stem, layer2, layer4]

implementation:
  split_runtime: native_prefix
  parameter_sync_mode: prefix_parameters
  prefix_executor: persistent_eager
  prefix_prewarm: before_client_connection
  server_replica_scope: per_client_persistent
  aggregation: reassemble_per_client_full_state_then_sample_weighted_mean
  torchlens_in_timed_path: false
  scheduler_profile_counters: per_round
  scheduler_coordination_cost: observed_round_time_minus_slowest_client_fit
  compile_executor: {used: false, reason: retained_a9_orin140_triton_incompatibility}

profile:
  required: true
  status: pending
  rounds: 9
  schedule: [stem, layer2, layer4, stem, layer2, layer4, stem, layer2, layer4]
  reuse_prior_profile: prohibited

methods:
  - fedavg_full_local
  - best_global_fixed
  - static_heterogeneous
  - edge_local_adaptive
  - resource_adaptive_splitfed

resource_scenario:
  phases:
    - {name: calibration, rounds: [1, 3]}
    - {name: natural_lan, rounds: [4, 25]}
    - {name: constrained_win136_boundary_link, rounds: [26, 60], uplink_mbps: 10, downlink_mbps: 50}
    - {name: recovered_natural_lan, rounds: [61, 100]}
  pacing_scope: split_boundary_messages_only

validity:
  expected_clients: 4
  expected_client_records_per_formal_run: 400
  expected_suffix_records_per_split_run: 400
  expected_evaluation_records: 100
  expected_decision_records_per_split_run: 388
  failures: invalidate_and_retain
  missing_data: no_imputation

claim_boundary: >-
  A10 is a same-hardware replication of the completed latest implementation.
  It does not overwrite or retroactively alter A8 or A9 conclusions.

