[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splitfleet"
version = "0.2.0"
authors = [
    {name="Boris Radovic", email="radovic.brs@gmail.com"}
]
requires-python = ">=3.10,<3.11"
description = "Unified split learning framework with autosplitting built on top of Flower."
readme = "README.md"
classifiers = [
    "Private :: Do Not Upload"
]

dependencies = [
    "flwr>=1.29.0",
    "torchlens==2.31.0",
    "torch>=2.11.0",
    "numpy>=2.2.6",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "ipython>=8.18.0",
    "graphviz>=0.20.0",
    "loguru>=0.7.0",
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "lz4>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "grpcio-tools>=1.62.0",
]

integration = [
    "torchvision>=0.26.0",
    "timm>=1.0.26",
    "ultralytics>=8.4.41",
    "rfdetr>=1.6.5",
    "transformers>=4.0.0",
]

[tool.uv.sources]
torchlens = { path = "./torchlens-2.31.0-py3-none-any.whl" }

[tool.setuptools.packages.find]
include = ["splitfleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
