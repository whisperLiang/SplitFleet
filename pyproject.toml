[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splitfleet"
version = "0.2.0"
authors = [
    {name="Boris Radovic", email="radovic.brs@gmail.com"}
]
requires-python = ">=3.10,<3.11"
description = "Unified split learning framework with autosplitting built on top of Flower."
readme = "README.md"
classifiers = [
    "Private :: Do Not Upload"
]

dependencies = [
    "flwr~=1.9.0",
    "torch>=2.4.0",
    "numpy<2",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "ipython>=8.18.0",
    "graphviz>=0.20.0",
    "loguru>=0.7.0",
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "grpcio-tools>=1.62.0",
]

[tool.setuptools.packages.find]
include = ["splitfleet*", "torchlens*", "model_management*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
