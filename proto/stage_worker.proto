syntax = "proto3";

package stage_worker;

service StageWorker {
  rpc RegisterPlan (RegisterPlanRequest) returns (RegisterPlanResponse) {}
  rpc ExecuteStage (StageExecutionRequest) returns (StageExecutionResponse) {}
  rpc BackwardStage (StageBackwardRequest) returns (StageBackwardResponse) {}
  rpc ClearExecution (ClearExecutionRequest) returns (ClearExecutionResponse) {}
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse) {}
}

message RegisterPlanRequest {
  string worker_id = 1;
  string plan_id = 2;
  bytes plan_descriptor = 3;
  bytes model_state = 4;
}

message RegisterPlanResponse {
  string worker_id = 1;
  string plan_id = 2;
  bool accepted = 3;
  string graph_signature = 4;
  string message = 5;
}

message StageExecutionRequest {
  string plan_id = 1;
  string stage_id = 2;
  string execution_id = 3;
  string client_id = 4;
  int32 round_id = 5;
  bool differentiable = 6;
  bool detach_boundary = 7;
  bytes seeded_values = 8;
  map<string, string> metadata = 9;
}

message StageExecutionResponse {
  bytes available_updates = 1;
  bytes stored_updates = 2;
  map<string, string> metadata = 3;
}

message StageBackwardRequest {
  string plan_id = 1;
  string stage_id = 2;
  string execution_id = 3;
  bytes upstream_grads = 4;
}

message StageBackwardResponse {
  bytes input_grads = 1;
  bytes parameter_grads = 2;
}

message ClearExecutionRequest {
  string execution_id = 1;
}

message ClearExecutionResponse {
  bool cleared = 1;
}

message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatResponse {
  string worker_id = 1;
  bool online = 2;
}
